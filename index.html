<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR - Animation 3D au scan</title>
 
  <!-- A-Frame + AR.js : versions compatibles entre elles -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
 
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #hint {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: rgba(0,0,0,.65); color: #fff; padding: 10px 16px;
      border-radius: 999px; font-size: 14px; z-index: 10; transition: opacity .3s;
    }
    #hint.hidden { opacity: 0; }
  </style>
 
  <script>
    // Déclenche / arrête l'animation quand le marqueur est détecté / perdu
    AFRAME.registerComponent('scan-trigger', {
      init: function () {
        const hint = document.getElementById('hint');
        const content = this.el.querySelector('#content');
        const pop = this.el.querySelector('#pop');
        this.el.addEventListener('markerFound', () => {
          hint.classList.add('hidden');
          content.setAttribute('visible', true);
          pop.emit('start-anim');
        });
        this.el.addEventListener('markerLost', () => {
          hint.classList.remove('hidden');
          content.setAttribute('visible', false);
          pop.setAttribute('scale', '0.01 0.01 0.01');
        });
      }
    });
  </script>
</head>
 
<body>
  <div id="hint">Scanne le marqueur Hiro avec la caméra</div>
 
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"
           vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">
 
    <a-marker preset="hiro" scan-trigger>
      <a-entity id="content" visible="false">
 
        <!-- Apparition (zoom) -->
        <a-entity id="pop"
          scale="0.01 0.01 0.01"
          animation__pop="property: scale; to: 1.5 1.5 1.5; dur: 900; easing: easeOutElastic; startEvents: start-anim">
 
          <!-- Cube qui tourne et flotte -->
          <a-box color="#4CC3D9" position="0 0.8 0" depth="0.8" height="0.8" width="0.8"
                 animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                 animation__float="property: position; dir: alternate; to: 0 1.1 0; loop: true; dur: 1200; easing: easeInOutSine"></a-box>
 
          <!-- Sphère qui orbite -->
          <a-entity animation__orbit="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear" position="0 0.8 0">
            <a-sphere color="#EF2D5E" radius="0.2" position="0.9 0 0"></a-sphere>
          </a-entity>
 
          <!-- Anneau au sol -->
          <a-torus color="#FFC65D" radius="1" radius-tubular="0.03" rotation="-90 0 0"
                   animation__pulse="property: scale; dir: alternate; to: 1.2 1.2 1.2; loop: true; dur: 1000; easing: easeInOutSine"></a-torus>
        </a-entity>
 
      </a-entity>
    </a-marker>
 
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
